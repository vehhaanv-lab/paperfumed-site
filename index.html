<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PaperFumed - Under maintenance</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 33'%3E%3Crect x='8' y='0' width='10' height='6.5' rx='2' fill='%23EBE2CE'/%3E%3Cpath fill='%23EBE2CE' d='M2 8.5L2 31Q2 33 4 33L22 33Q24 33 24 31L24 14.5L16.5 8.5Z'/%3E%3Cpath fill='rgba(77,184,126,.5)' d='M16.5 8.5L24 14.5L16.5 14.5Z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<style>
html,body{height:100%;margin:0;overscroll-behavior:none}
body{font-family:Montserrat,system-ui,sans-serif;color:#22301f;overflow:hidden}
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;
background:linear-gradient(180deg,#b9d9ee 0%,#d9eaf4 42%,#f2ede0 100%)}
.cloud{position:absolute;background:#fff;border-radius:50%;filter:blur(28px);opacity:.75}
.c1{width:420px;height:120px;top:16%;left:-10%;animation:drift 60s linear infinite}
.c2{width:300px;height:90px;top:58%;left:60%;animation:drift 80s linear infinite reverse}
@keyframes drift{from{transform:translateX(-15vw)}to{transform:translateX(115vw)}}
.stage{position:fixed;inset:0;z-index:2;display:flex;align-items:stretch}
.copy{flex:1 1 42%;display:flex;flex-direction:column;justify-content:center;padding:0 24px 0 8vw;max-width:640px;min-width:0}
#scene{flex:1 1 58%;min-width:0;height:100%;cursor:grab}
#scene:active{cursor:grabbing}
.k{font-size:12px;letter-spacing:.26em;font-weight:700;color:#5c6650;text-transform:uppercase;margin-bottom:22px}
h1{font-size:clamp(44px,6.4vw,88px);font-weight:800;letter-spacing:-.03em;line-height:1.03;margin:0}
h1 em{font-style:normal;color:#5c6e4a}
.sub{font-size:17px;line-height:1.7;color:#3d4a38;max-width:44ch;margin:28px 0 0;font-weight:500}
@media(pointer:coarse){}
@media(max-width:820px){
.stage{flex-direction:column}
.copy{flex:0 0 auto;padding:7svh 24px 0;justify-content:flex-start;max-width:none}
#scene{flex:1 1 auto;min-height:0;height:auto}
.k{font-size:11px;margin-bottom:16px}
.sub{font-size:16px;margin-top:20px}
}
</style></head>
<body>
<div class="sky"><div class="cloud c1"></div><div class="cloud c2"></div></div>
<div class="stage">
<div class="copy"><p class="k">PaperFumed &middot; Under maintenance</p>
<h1>Floating while<br><em>we rebuild.</em></h1>
<p class="sub">PaperFumed is an idea-stage research project asking whether paper can replace the plastic water bottle in India. This page is temporary; the question is not.</p>
</div>
<div id="scene" role="img" aria-label="A paper bottle floating in the sky, slowly turning. Drag to rotate it."></div>
</div>
<script type="module">
import * as THREE from './three.module.js';

const holder = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
holder.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, .1, 100);
camera.position.set(0, .5, 6.6);

scene.add(new THREE.HemisphereLight(0xdcecf7, 0xe8dcc4, 1.0));
const key = new THREE.DirectionalLight(0xfff2dd, 1.5);
key.position.set(3.5, 5, 4);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.left = -2; key.shadow.camera.right = 2;
key.shadow.camera.top = 3; key.shadow.camera.bottom = -2;
key.shadow.radius = 6; key.shadow.bias = -0.0004;
scene.add(key);
const rim = new THREE.DirectionalLight(0xbcd6ea, .95); rim.position.set(-4, 3, -3); scene.add(rim);
const fill = new THREE.DirectionalLight(0xffe9c8, .35); fill.position.set(-2, .8, 4); scene.add(fill);

// ---------- kraft paper texture (colour + dedicated bump) ----------
function kraftCanvas(size, forBump){
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const g = cv.getContext('2d');
  g.fillStyle = forBump ? '#7f7f7f' : '#dac9a5'; g.fillRect(0,0,size,size);
  // large soft mottling
  for (let i=0;i<46;i++){
    const x=Math.random()*size, y=Math.random()*size, r=40+Math.random()*130;
    const dark = Math.random()<.5;
    const gr = g.createRadialGradient(x,y,0,x,y,r);
    if (forBump){
      gr.addColorStop(0, dark?'rgba(96,96,96,.10)':'rgba(168,168,168,.10)');
    } else {
      gr.addColorStop(0, dark?'rgba(148,120,80,.07)':'rgba(243,231,203,.08)');
    }
    gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  }
  // fine grain
  const grains = forBump ? 34000 : 52000;
  for (let i=0;i<grains;i++){
    const x=Math.random()*size, y=Math.random()*size, v=Math.random();
    g.fillStyle = forBump
      ? (v<.5?'rgba(70,70,70,.10)':'rgba(190,190,190,.10)')
      : (v<.5?'rgba(122,97,62,.05)':'rgba(255,246,228,.06)');
    g.fillRect(x,y,1.3,1.3);
  }
  // fibres, biased near-vertical like a moulded grain
  const fibres = forBump ? 620 : 950;
  for (let i=0;i<fibres;i++){
    const x=Math.random()*size, y=Math.random()*size;
    const a=(Math.random()<.72 ? (Math.random()-.5)*.7 + Math.PI/2 : Math.random()*Math.PI);
    const l=4+Math.random()*26;
    const dark=Math.random()<.55;
    g.strokeStyle = forBump
      ? (dark?'rgba(60,60,60,':'rgba(200,200,200,') + (0.10+Math.random()*0.16) + ')'
      : (dark?'rgba(110,86,52,':'rgba(250,240,218,') + (0.03+Math.random()*0.05) + ')';
    g.lineWidth = .6+Math.random()*.6;
    g.beginPath(); g.moveTo(x,y);
    g.quadraticCurveTo(x+Math.cos(a)*l*.5+(Math.random()-.5)*4, y+Math.sin(a)*l*.5+(Math.random()-.5)*4, x+Math.cos(a)*l, y+Math.sin(a)*l);
    g.stroke();
  }
  // recycled flecks
  if (!forBump){
    for (let i=0;i<130;i++){
      const x=Math.random()*size, y=Math.random()*size;
      g.fillStyle = 'rgba(96,74,44,'+(0.05+Math.random()*0.07)+')';
      g.beginPath(); g.ellipse(x,y,.6+Math.random()*1.6,.5+Math.random()*1.1,Math.random()*3,0,7); g.fill();
    }
  }
  return cv;
}
const colCv = kraftCanvas(1024, false);
const bmpCv = kraftCanvas(1024, true);
const tex = new THREE.CanvasTexture(colCv);
tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(3,2);
tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
const bmp = new THREE.CanvasTexture(bmpCv);
bmp.wrapS = bmp.wrapT = THREE.RepeatWrapping; bmp.repeat.set(3,2);

const kraft = new THREE.MeshStandardMaterial({map:tex, bumpMap:bmp, bumpScale:1.35, roughness:.94, roughnessMap:bmp, metalness:0});
const kraftDark = new THREE.MeshStandardMaterial({map:tex, bumpMap:bmp, bumpScale:.6, roughness:.95, metalness:0, color:0xd6c4a0});
const kraftCap = new THREE.MeshStandardMaterial({map:tex, bumpMap:bmp, bumpScale:.45, roughness:.9, metalness:0, color:0xf3e9d4});

// ---------- bottle silhouette ----------
// refined profile: rounded heel, gentle waist, soft shoulder, neck ring
const prof = [
  [0,0],[.30,0],[.385,.015],[.43,.05],[.448,.12],[.45,.30],[.446,.55],
  [.432,.85],[.424,1.0],[.428,1.12],[.424,1.26],[.40,1.40],[.345,1.52],
  [.27,1.62],[.20,1.69],[.165,1.75],[.155,1.81],
  [.178,1.83],[.178,1.885],[.155,1.905],[.152,1.94],[0,1.94]
];
const pts = prof.map(p => new THREE.Vector2(p[0], p[1]));
const body = new THREE.Mesh(new THREE.LatheGeometry(pts, 96), kraft);
body.castShadow = true;

// cap with ridge rings
const capProf = [[0,1.92],[.18,1.92],[.202,1.945],[.205,2.05],[.192,2.085],[.16,2.108],[0,2.108]];
const cap = new THREE.Mesh(new THREE.LatheGeometry(capProf.map(p=>new THREE.Vector2(p[0],p[1])), 96), kraftCap);
cap.castShadow = true;

const bottle = new THREE.Group();
bottle.add(body); bottle.add(cap);
// cap ridge rings
for (let i=0;i<3;i++){
  const ring = new THREE.Mesh(new THREE.TorusGeometry(.2035, .005, 10, 72), kraftDark);
  ring.rotation.x = Math.PI/2; ring.position.y = 1.968 + i*.036;
  bottle.add(ring);
}
// moulded grip rings near the base (physical detail, not a label)
for (let i=0;i<2;i++){
  const ring = new THREE.Mesh(new THREE.TorusGeometry(.447, .0045, 10, 96), kraftDark);
  ring.rotation.x = Math.PI/2; ring.position.y = .30 + i*.055;
  bottle.add(ring);
}
bottle.position.y = -1.02;
scene.add(bottle);

// real soft ground shadow
const ground = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), new THREE.ShadowMaterial({opacity:.16, color:0x3a4630}));
ground.rotation.x = -Math.PI/2; ground.position.y = -1.09; ground.receiveShadow = true;
scene.add(ground);

// drifting paper specks - quiet life around the bottle
const speckMat = new THREE.MeshBasicMaterial({color:0xf3ead6, transparent:true, opacity:.85, side:THREE.DoubleSide});
const specks = [];
for (let i=0;i<14;i++){
  const s = new THREE.Mesh(new THREE.PlaneGeometry(.035+Math.random()*.04, .025+Math.random()*.03), speckMat);
  s.userData = {r: 1.0+Math.random()*1.4, sp: .12+Math.random()*.22, ph: Math.random()*7, h: -1+Math.random()*2.6, fl: .5+Math.random()};
  specks.push(s); scene.add(s);
}

let mx = 0, my = 0, dragRot = 0, dragging = false, lastX = 0;
addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse') {
    mx = (e.clientX / innerWidth - .5);
    my = (e.clientY / innerHeight - .5);
  }
});
holder.style.touchAction = 'none';
holder.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; holder.setPointerCapture(e.pointerId); });
holder.addEventListener('pointermove', e => {
  if (!dragging) return;
  dragRot += (e.clientX - lastX) * .009;
  lastX = e.clientX;
});
holder.addEventListener('pointerup', () => { dragging = false; });
holder.addEventListener('pointercancel', () => { dragging = false; });

function size(){
  const w = holder.clientWidth, h = holder.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', size); size();

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const qa = new URLSearchParams(location.search);
const freezeA = qa.has('a') ? parseFloat(qa.get('a')) : null;   // frozen rotation for captures
const freezeB = qa.has('b') ? parseFloat(qa.get('b')) : 0;     // frozen clock

let t = 0;
function tick(){
  requestAnimationFrame(tick);
  if (freezeA === null && !reduce) t += .016;
  const tt = freezeA === null ? t : freezeB;
  bottle.rotation.y = (freezeA === null ? tt * .5 : freezeA) + dragRot;
  bottle.position.y = -1.02 + Math.sin(tt * .9) * .07;
  bottle.rotation.z = Math.sin(tt * .5) * .018;
  for (const s of specks){
    const u = s.userData, a2 = tt * u.sp + u.ph;
    s.position.set(Math.cos(a2)*u.r, u.h + Math.sin(tt*u.fl + u.ph)*.18, Math.sin(a2)*u.r*.6);
    s.rotation.set(tt*u.fl*.7 + u.ph, a2, u.ph);
  }
  camera.position.x += ((mx * .9) - camera.position.x) * .05;
  camera.position.y += ((.5 - my * .7) - camera.position.y) * .05;
  camera.lookAt(0, .08, 0);
  renderer.render(scene, camera);
}
tick();
</script>
</body></html>
